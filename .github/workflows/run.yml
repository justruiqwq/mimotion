name: 刷步数

on:
  # 每天北京时间 12:30 / 13:00 / 13:30 触发（UTC 04:30/05:00/05:30）。
  # GitHub Actions 的 schedule 可能被延迟或跳过，多设几个点用脚本去重兜底：
  # 当天已刷过就跳过，保证即使 12:30 被跳过也能补上，且一天只刷一次。
  schedule:
    - cron: '30 4,5,6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '立即刷全部账号（手动补刷或测试用）'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}
      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        # 仅在 encrypted_tokens.data 有变化时才提交，避免无谓的 commit 噪音；
        # 手动 force 与定时任务可能并发触发，push 前先 rebase 避免 non-fast-forward 冲突
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "token 无变化，跳过提交"
          else
            git commit -m "persist tokens trigger by ${{ github.event_name }}"
            git pull --rebase origin master || true
            git push origin master
          fi
